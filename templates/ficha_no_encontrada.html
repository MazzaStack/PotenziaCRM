<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propiedad no encontrada | {{ agency.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #F8FAFC;
            color: #2D3748;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .notfound-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.06);
            border: 1px solid #E2E8F0;
            max-width: 540px;
            width: 90%;
            padding: 45px 35px;
            text-align: center;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #FEF3C7;
            color: #D97706;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="notfound-card">
        <div class="icon-circle">
            <i class="bi bi-search"></i>
        </div>
        <h2 class="fw-bold mb-2">Propiedad no encontrada</h2>
        <p class="text-muted mb-4">
            El enlace ingresado no corresponde a ninguna propiedad activa en este momento. Verificá la dirección URL o comunicate con tu asesor inmobiliario.
        </p>

        <div class="text-muted small">
            <span>{{ agency.nombre }}</span>
        </div>
    </div>
</body>
</html>
